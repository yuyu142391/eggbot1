name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --onefile --windowed --name EggBot --hidden-import serial.tools.list_ports eggbot_app_fixed_16.py

      - uses: actions/upload-artifact@v4
        with:
          name: EggBot-windows
          path: dist/EggBot.exe
